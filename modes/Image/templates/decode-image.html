{% extends "base.html" %}
{% block title %}Decode Image — StegaVault{% endblock %}
{% block content %}
<div class="container">
  <div class="panel">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb mb-3">
        <li class="breadcrumb-item"><a href="/">Home</a></li>
        <li class="breadcrumb-item active">Image → Image Decode</li>
      </ol>
    </nav>
    <div class="panel-title"><i class="bi bi-unlock-fill"></i> Extract Hidden Image</div>
    <p class="text-muted mb-4">Upload an encoded image file to extract the hidden secret image from it.</p>

    <form action="/image/decode-result" method="POST" enctype="multipart/form-data"
          data-loading="Decoding image… please wait">

      <div class="mb-4">
        <label class="form-label">🖼️ Encoded Image File</label>
        <div class="file-drop">
          <input type="file" name="image" accept="image/*" required class="d-none">
          <label class="file-label">
            <i class="bi bi-image-fill"></i>
            <span>Click to choose encoded image</span>
          </label>
        </div>
      </div>

      <div class="d-flex gap-3">
        <button type="submit" class="btn btn-primary"><i class="bi bi-unlock-fill me-2"></i>Decode</button>
        <a href="/" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
