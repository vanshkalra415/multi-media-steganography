{% extends "base.html" %}
{% block title %}Decode Audio — StegaVault{% endblock %}
{% block content %}
<div class="container">
  <div class="panel">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb mb-3">
        <li class="breadcrumb-item"><a href="/">Home</a></li>
        <li class="breadcrumb-item active">Text → Audio Decode</li>
      </ol>
    </nav>
    <div class="panel-title"><i class="bi bi-unlock-fill"></i> Extract Hidden Text from Audio</div>
    <p class="text-muted mb-4">Upload an encoded WAV file to reveal the hidden secret message.</p>

    <form action="/audio/decode-result" method="POST" enctype="multipart/form-data"
          data-loading="Decoding audio… please wait">

      <div class="mb-4">
        <label class="form-label">🎵 Encoded WAV Audio File</label>
        <div class="file-drop">
          <input type="file" name="audio" accept=".wav,audio/wav" required class="d-none">
          <label class="file-label">
            <i class="bi bi-music-note-beamed"></i>
            <span>Click to choose encoded WAV file</span>
          </label>
        </div>
      </div>

      <div class="d-flex gap-3">
        <button type="submit" class="btn btn-primary"><i class="bi bi-unlock-fill me-2"></i>Decode</button>
        <a href="/" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
